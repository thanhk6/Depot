                  contentType: image/jpeg
              maintenanceOrderLines:
                - equipmentDamageCode: BK
                  maintenanceTypeCode: '6382'
                  maintenanceRepairLocationCode: XX00
                  thirdPartyIndicator: THIRD_PARTY
                  repairQuantity: 2
                  manHoursPerPiece: 0.1
                  materialCostPerPiece: 0
                  maintenanceOrderParts:
                    - partNumber: 41-2953
                      unitQuantity: 1
                      unitPrice: 0
