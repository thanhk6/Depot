openapi: 3.0.1
info:
  title: Container Maintenance & Repair API
  description: |
    Create, validate and retrieve maintenance orders for Maersk containers.  
    
    # Overview

    The AEMS (Advanced Equipment Maintenance System) team is making APIs available specifically for external depot and vendor systems to manage and monitor orders within the AEMS system. Access to these endpoints will be restricted to systems and applications approved and onboarded as external order providers.  
    
    # Who can get access?

    Maersk’s suppliers creating maintenance and repair orders using the Maersk Advanced Equipment Management System (AEMS) can get access to the API.    
    
    # Getting started  
    
    Access to this API is limited to approved developers currently doing
    business with Maersk. To request access, you need to **<a
    href="https://developer.maersk.com/login" target="_blank"
    style="font-weight: bold;"><u>login</u></a>** using your company email
    address and create an App to enable this API product for your Consumer Key.
    For step-by-step instructions, please refer to our **<a
    href="https://developer.maersk.com/support/getting-started-api"
    target="_blank" style="font-weight: bold;"><u>Getting Started
    Guide</u></a>**.  

    
    # Technical specifications  
    
    The AEMS platform exposes the following three core APIs, each supporting distinct business functionalities, along with their respective OpenAPI Specification (OAS) files:
    
    1. **Maintenance Orders API** - Provides full CRUD (Create, Read, Update, Delete) functionality for managing maintenance orders. This includes tracking orders from submission to approval.  
    **<a href="https://edpmediastorage.blob.core.windows.net/media/container-maintenance-repair_v1-0_13112024_spec.yaml" target="_blank" style="font-weight: bold;"><u>Download OpenAPI Document</u></a>**. 
    
    2. **Uploads and Attachments API** - Enables uploading and downloading of various file types (images, PDFs, etc.), which can be attached to orders as supporting documentation or evidence.  
    **<a href="https://edpmediastorage.blob.core.windows.net/media/container-uploads-attachments_v1-0_11112024_spec.yaml" target="_blank" style="font-weight: bold;"><u>Download OpenAPI Document</u></a>**. 
    
    3. **User Identity API** - Used to verify client identity and confirm access permissions to the relevant shop resources. This API is primarily utilized for integration testing.  
    **<a href="https://edpmediastorage.blob.core.windows.net/media/container-user-identity_v1-0_11112024_spec.yaml" target="_blank" style="font-weight: bold;"><u>Download OpenAPI Document</u></a>**. 
    
    Please note that all master data (such as repair codes, part numbers, and shop contracts) must be maintained independently by each depot system. These data elements are not provided through any of the APIs.    
    

    # OAuth 2.0

    **<a href="https://developer.maersk.com/support/authorisation"
    target="_blank" style="font-weight: bold;"><u>Authorisation Guide</u></a>**  
    
    
    # Using the AEMS Container Maintenance & Repair APIs  

    **<a href="https://edpmediastorage.blob.core.windows.net/media/aems-container-maintenance-repair-integration-guide_v3-0.pdf" target="_blank" style="font-weight: bold;"><u>Download the AEMS Integration Guide</u></a>** for detailed instructions how to interact with the API endpoints to manage and monitor orders.  

    Also **<a href="https://edpmediastorage.blob.core.windows.net/media/AEMS%20API%20Integration.postman_collection_v2.json" target="_blank" style="font-weight: bold;"><u>download the accompanying Postman Collection</u></a>**. It includes scripts for all the steps needed for quick and efficient testing of each endpoint.  
    
    # How many calls can I make?

    Traffic and spike arrest limits are configured at the consumer key level for
    each API Product as detailed in the table below. If these limits are
    exceeded, the request is rejected with a 429 Too Many Requests HTTP status
    code.

    | Quota per Consumer Key | Traffic Surge Rate Limit per Consumer Key |  
    |------------------------|-------------------------------------------|  
    | 5000 calls per hour    | 6000 calls per minute |  
    
    
    # FAQs (Frequently Asked Questions) 
    
    
    **Q: What should I do if I receive the following error:  "User [xyz] has not been added to the system."?**  

     A: Your consumer key has been approved by the AEMS Team, but it has not yet been mapped to the shop(s) for which your consumer key can access.  Please send an email using the template in the **General Support** section below.  Be sure to include the email subject: **AEMS - Map consumer-key to shops**. 
     
         
    **Q: What should I do if I receive any other errors while accessing/using your API?**  
    
    A: For any other errors received while accessing our API, please send an email using the template in the **General Support** section below, replacing the description, cURL request and response content with your actual errors.  
    

    # General Support
    
    Please use the following email template if you have additional questions or require technical assistance, replacing the required values with details specific to your inquiry.  
    
    **IMPORTANT:** Emails sent without the "AEMS -" subject prefix will not be routed to our team and will not be handled.  
    
    ```text
    To: vitservicedesk@maersk.com  
    Subject: AEMS - General vendor support integrating with APIs 
    
    Email Body:
    
    Environment: Stage  
    Consumer Key: 9Opx2aDpSd2sFROrL2HZDhAXge9tdL7D  
    Shop Code(s): [ABC, DEF]  
    Description: I am trying to upload images using the upload API, but I am getting error 401 - Unauthorized in return.  
   
    cURL Request:
    curl --request POST \  
    --url https://api-stage.maersk.com/aems/blob-manager/api/manage/ABC/upload \  
    --header 'Authorization: Bearer vErYLoNgAcCeSsToKeNGoEsHeRe123' \  
    --header 'Consumer-Key: 9Opx2aDpSd2sFROrL2HZDhAXge9tdL7D' \  
    --header 'accept: */*' \  
    --header 'content-type: multipart/form-data' \  
    --form 'file=@/Users/oliver/Desktop/CleanShot_2024-09-16_at_15.29.16@2x.png'  
     
    Response code: 401  
    Response content:
    {  
     "httpMethod": "POST",  
     "requestUri": "/api/manage/xyz/upload",  
     "statusCode": 401,  
     "statusText": "Unauthorized",  
     "errorMessage": "Failed authenticating using the parsed bearer token.",  
     "correlationIdentifier": "0HN749U0FM5K7:00000002",  
     "status": null,  
     "errorTimestamp": "2024-10-04T08:36:40.023753+00:00",  
     "detailedErrors": null  
    }  
    ```

    
    
