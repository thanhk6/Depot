    get:
      tags:
        - OrderList
      summary: Get orders list
      description: "Get a paged collection of maintenance orders associated with the authenticated user \n\r\n<b>Maintenance order status codes:</b><br/>Draft = 10,<br/>Rejected = 100,<br/>DeclaredAsTTL = 150,<br/>PendingApproval = 200,<br/>PendingSpecialistApproval = 330,<br/>SuspendForTTLCheck = 340,<br/>SuspendToCENELM = 320,<br/>Approved = 390,<br/>RepairCompleted = 400,<br/>PurchaseOrderInitiated = 500,<br/>PurchaseOrderFailed = 550,<br/>PurchaseOrderCreated = 600,<br/>PaymentFailed = 650,<br/>PaymentCompleted = 800,<br/>Processed = 900,<br/>Deleted = 9999<br/>"
      operationId: get-maintenance-orders
      responses:
        '200':
          description: "<b>OK</b>\r\n\n"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceOrderHeader'
          headers:
            First-Page:
              $ref: '#/components/headers/First-Page'
            Previous-Page:
              $ref: '#/components/headers/Previous-Page'
            Current-Page:
              $ref: '#/components/headers/Current-Page'
            Next-Page:
              $ref: '#/components/headers/Next-Page'
            Last-Page:
              $ref: '#/components/headers/Last-Page'
            Total-Item-Count:
              $ref: '#/components/headers/Total-Item-Count'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: maintenanceOrderNumber
          in: query
          description: Filter by maintenance order number (optional).
          schema:
            type: integer
            format: int64
        - name: equipmentNumber
          in: query
          description: Filter by equipment number (optional).
          schema:
            type: string
        - name: maintenanceShopCodes
          in: query
          description: >-
            Filter by maintenance order by the shop code (optional). Provide as
            a comma-separated string.
          schema:
            type: string
        - name: maintenanceOrderStatusTypes
          in: query
          description: >-
            Filter by maintenance order status code (optional). Provide as a
            comma-separated string.
          schema:
            type: string
        - name: maintenanceRepairModes
          in: query
          description: >-
            Filter by maintenance repair mode (optional). Provide as a
            comma-separated string.
          schema:
            type: string
        - name: fromDate
          in: query
          description: "The start date to filter maintenance orders by their creation date (optional). \r\nIf provided, only maintenance orders created on or after this date will be included."
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          description: "The end date to filter maintenance orders by their creation date (optional). \r\nIf provided, only maintenance orders created on or before this date will be included."
          schema:
            type: string
            format: date-time
        - name: searchText
          in: query
          description: >-
            Filter by maintenance order by either searching with equipment
            number or the  maintenance order number (optional).
          schema:
            type: string
