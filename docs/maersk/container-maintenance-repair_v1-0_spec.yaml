                maintenanceShopCode: XYZ
                isoCurrencyCode: AED
                exchangeRate: 0.272264
                locationCode: SLASTM
                equipmentNumber: MAEU4666883
                previousMaintenanceTimestamp: '0001-01-01T00:00:00'
