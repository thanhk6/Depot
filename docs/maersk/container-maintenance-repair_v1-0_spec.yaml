      tags:
        - Order
      summary: Updates and validates a maintenance order.
      description: "<b>Maintenance order status codes:</b><br/>Draft = 10,<br/>Rejected = 100,<br/>DeclaredAsTTL = 150,<br/>PendingApproval = 200,<br/>PendingSpecialistApproval = 330,<br/>SuspendForTTLCheck = 340,<br/>SuspendToCENELM = 320,<br/>Approved = 390,<br/>RepairCompleted = 400,<br/>PurchaseOrderInitiated = 500,<br/>PurchaseOrderFailed = 550,<br/>PurchaseOrderCreated = 600,<br/>PaymentFailed = 650,<br/>PaymentCompleted = 800,<br/>Processed = 900,<br/>Deleted = 9999<br/> \n\r\n<b>Maintenance order cause codes:</b><br/>CONFIRMED_3RD_PARTY<br/>HANDLING_DAMAGE<br/>UNCONFIRMED_3RD_PARTY<br/>WEAR_AND_TEAR<br/> \n\r\n<b>Third party indicator codes:</b><br/>INTERMODAL<br/>OWNER<br/>TERMINAL<br/>THIRD_PARTY<br/>WEAR_AND_TEAR<br/>MANUFACTURE_WARRANTY<br/>"
      operationId: put-maintenance-orders-by-id
      requestBody:
        description: The maintenance order to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceOrderUpdateRequest'
      parameters:
        - name: maintenanceOrderNumber
          in: path
          description: The unique identifier of the maintenance order.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "<b>OK</b>\r\n\nThe maintenance order was successfully processed and updated in the system"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
        - Order
      summary: Gets a maintenance order.
      description: Gets a maintenance order based on the unique maintenance order number.
      operationId: get-maintenance-orders-by-id
      parameters:
        - name: maintenanceOrderNumber
          in: path
          description: The unique identifier of the maintenance order.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: <b>OK</b>
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Order
      summary: Deletes a maintenance order
      description: Deletes a maintenance order based on maintenance order number.
      operationId: delete-maintenance-orders-by-id
      parameters:
        - name: maintenanceOrderNumber
          in: path
          description: The unique identifier of the maintenance order.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: <b>OK</b>.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/maintenance-orders/{maintenanceOrderNumber}/remarks:
    post:
      tags:
        - OrderRemarks
      summary: Creates a remark for a maintenance order.
      description: "Creates a remark for a maintenance order.\n\r\n <b>Remark scope types:</b> <br/>1 = Remark for GSC <br/>2 = Remark for everyone<br/>"
      operationId: post-maintenance-order-remarks
      parameters:
        - name: maintenanceOrderNumber
          in: path
          description: The unique identifier of the maintenance order.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
