      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
        - OrderRemarks
      summary: Get all remark based on a maintenance order number.
      description: Get maintenance order remark
      operationId: get-maintenance-order-remarks
      parameters:
        - name: maintenanceOrderNumber
          in: path
          description: The unique identifier of the maintenance order.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceOrderRemarkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/maintenance-orders/{maintenanceOrderNumber}/complete-repair:
    patch:
      tags:
        - OrderStatus
      summary: Completes repair and updates the serial numbers.
      description: >-
        Marks the maintenance order as repair completed. Additionally, it
        updates the serial numbers for any parts that were replaced during the
        repair process.
      operationId: patch-maintenance-order-complete-repair
      parameters:
        - name: maintenanceOrderNumber
          in: path
          description: The unique identifier of the maintenance order.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The maintenance order to update.
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/MaintenanceOrderPartSerialNumberUpdateRequest
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/maintenance-orders/{maintenanceOrderNumber}/status:
    get:
      tags:
        - OrderStatus
      summary: Gets maintenance order status
      description: "Gets the current and historical statuses of a maintenance order including when they were applicable from.\n\r\n<b>Maintenance order status codes:</b><br/>Draft = 10,<br/>Rejected = 100,<br/>DeclaredAsTTL = 150,<br/>PendingApproval = 200,<br/>PendingSpecialistApproval = 330,<br/>SuspendForTTLCheck = 340,<br/>SuspendToCENELM = 320,<br/>Approved = 390,<br/>RepairCompleted = 400,<br/>PurchaseOrderInitiated = 500,<br/>PurchaseOrderFailed = 550,<br/>PurchaseOrderCreated = 600,<br/>PaymentFailed = 650,<br/>PaymentCompleted = 800,<br/>Processed = 900,<br/>Deleted = 9999<br/>"
      operationId: get-maintenance-orders-status-by-id
      parameters:
        - name: maintenanceOrderNumber
          in: path
          description: The unique identifier of the maintenance order.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: <b>OK</b>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceOrderStatusHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    MaintenanceOrderCreateRequest:
      type: object
      properties:
        maintenanceShopCode:
          type: string
          description: Unique 3 character code used to identify a maintenance shop.
          nullable: true
        equipmentNumber:
          type: string
          description: >-
            Unique identifier of the equipment e.g., ISO combined code for a
            container. Currently, only container equipment numbers are
            supported.
          nullable: true
        reeferContainerCondition:
          type: string
          description: "An upper snake case code provided by maintenance shop representing the condition of the reefer container.\r\nPossible values are 'BOX_OK' or 'MAC_OK' or 'NOT_PROVIDED'."
          nullable: true
        maintenanceOrderCause:
          type: string
          description: "An upper snake case code identifying what or who caused the need for maintenance or repair.\r\nPossible values are 'CONFIRMED_3RD_PARTY' or 'HANDLING_DAMAGE' or 'UNCONFIRMED_3RD_PARTY' or 'WEAR_AND_TEAR'"
          nullable: true
        damagedAt:
          type: string
          description: "Unique code which identifies the location of the facility or terminal where the equipment was damaged.\r\nRequired when the maintenance order cause is CONFIRMED_3RD_PARTY./>"
          nullable: true
        maintenanceRepairModeCode:
          type: string
          description: >-
            2 character uppercase mode identifying the performed service of
            maintenance/repair for the chosen equipment.
          nullable: true
        vendorsReference:
          type: string
          description: Reference number that identifies the vendor or maintenance shop.
